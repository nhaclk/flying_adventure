name: flying_adventure

description: A polished Flappy Bird style Flutter + Flame game with three custom characters.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.2
  flame_audio: ^2.12.2
  flutter_launcher_icons: ^0.14.4
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  # Add this line to remove the alpha channel for iOS
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/characters/
    - assets/game/
    - assets/audio/
